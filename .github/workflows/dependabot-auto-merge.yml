name: Dependabot auto-merge

on: pull_request

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Enabling auto-merge does NOT merge immediately -- GitHub holds the
      # merge until every required status check on this PR (the CI workflow
      # above) reports success. If a dependency bump breaks the build or the
      # test suite, this PR sits open for a human to look at; nothing lands
      # on main unattended.
      - run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
